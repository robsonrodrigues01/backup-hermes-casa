<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório Virtual cuidar.vc</title>
<style>
:root{--woodtop:#dcb284;--woodside:#a97e4f;--wooddark:#8a6239;--wallc:#d7dcd2;--wall2:#b3bfae;--ink:#26221c;--accent:#0d9488;--neon:#8de9d8;--ease:cubic-bezier(.16,1,.3,1);--tilt:56deg}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(1200px 600px at 50% -100px,#122028,#0a0f12 70%);color:#f5f1e8;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:#0d1518e6;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:50;backdrop-filter:blur(6px)}
header h1{font-size:16px}
.hinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.badge{background:#123f38;border:1px solid var(--accent);color:var(--neon);border-radius:20px;padding:4px 10px;font-weight:600}
.badge.warn{background:#4a1512;border-color:#e05d4b;color:#ffb3a6}
#clock{font-variant-numeric:tabular-nums;background:#1a2422;border-radius:8px;padding:4px 8px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{background:#131b1e;border:1px solid #24343a;color:#d8e2dd;border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap}
.fitwrap{position:relative;margin:0 auto;overflow:hidden;border-radius:16px}
.fitwrap.zoomed{overflow-x:auto;cursor:grab}
.scenebox{transform-origin:0 0}
.viewport{position:relative;width:1140px;height:640px;perspective:1500px;perspective-origin:50% 20%;background:linear-gradient(180deg,#1d2f36 0%,#101a1e 100%);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px #21343a;overflow:hidden}
.viewport::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,transparent 55%,rgba(4,8,10,.5));z-index:99}
.world{position:relative;width:1140px;height:660px;transform-style:preserve-3d;transform:rotateX(var(--tilt)) translateZ(0)}
.floor{position:absolute;inset:0;border-radius:12px;background:linear-gradient(180deg,#d8b588,#c89b6d 70%,#bd8f61);box-shadow:inset 0 0 0 3px #b3855a,inset 0 0 60px rgba(120,80,30,.35)}
.floor::before{content:'';position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(90deg,transparent 0 112px,rgba(90,60,25,.18) 112px 114px),repeating-linear-gradient(0deg,transparent 0 190px,rgba(255,240,210,.09) 190px 192px)}
.wshade{position:absolute;inset:0;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,240,.16),transparent 60%);pointer-events:none}
.rug{position:absolute;left:330px;top:300px;width:230px;height:150px;background:radial-gradient(#d9cbb4,#b3a288);border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.15);opacity:.9}
.walln{position:absolute;left:0;top:0;width:1140px;height:128px;transform-origin:top;transform:rotateX(90deg);background:linear-gradient(180deg,var(--wallc),var(--wall2) 78%,#9aa794);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);backface-visibility:hidden}
.walle{position:absolute;right:0;top:0;width:280px;height:128px;transform-origin:right;transform:rotateY(-90deg);background:linear-gradient(180deg,#c4cec0,#a8b4a2 78%,#93a08c);backface-visibility:hidden}
.win{position:absolute;height:66px;top:30px;border-radius:8px;background:linear-gradient(#9fd4ec,#e6f6fb 70%,#cfeaf6);border:4px solid #7d766a;box-shadow:0 0 18px rgba(150,220,255,.5),inset 0 3px 8px rgba(255,255,255,.7);overflow:hidden}
.win::before{content:'';position:absolute;left:-80px;top:10px;width:56px;height:12px;background:#ffffffd9;border-radius:10px;box-shadow:34px 6px 0 -2px #ffffffb3,90px 2px 0 -4px #ffffff96;animation:clouds 36s linear infinite}
.win::after{content:'';position:absolute;right:22px;top:10px;width:14px;height:14px;border-radius:50%;background:radial-gradient(#ffe9a0,#f7c948);box-shadow:0 0 12px #ffd76e99;animation:sun 5s ease-in-out infinite}
@keyframes clouds{to{transform:translateX(820px)}}
@keyframes sun{50%{transform:scale(1.15)}}
.glassn{position:absolute;left:848px;top:0;width:292px;height:128px;transform-origin:top;transform:rotateX(90deg);background:linear-gradient(180deg,rgba(210,235,240,.55),rgba(190,220,230,.28));border-left:3px solid rgba(255,255,255,.55);backdrop-filter:blur(2px)}
.glasse{position:absolute;right:0;top:0;width:280px;height:128px;transform-origin:right;transform:rotateY(-90deg);background:linear-gradient(90deg,rgba(190,220,230,.4),rgba(210,235,240,.18));border-top:3px solid rgba(255,255,255,.45)}
.zlab{position:absolute;transform:translateZ(26px) rotateX(calc(-1*var(--tilt)));transform-origin:50% 100%;font-size:11px;font-weight:700;letter-spacing:.4px;color:#4b5d54;background:#f0ead9cc;border:1px solid #b8ae98;border-radius:12px;padding:3px 10px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.shadow{position:absolute;border-radius:50%;background:rgba(20,12,4,.35);filter:blur(3px)}
.box{position:absolute;transform-style:preserve-3d}
.box>div{position:absolute;backface-visibility:hidden}
.btop{inset:0;background:var(--woodtop);border:2px solid #b3855a;border-radius:8px;box-shadow:inset 0 2px 0 #f1d3a9}
.bsn{left:0;top:100%;width:100%;height:var(--h);transform-origin:top;transform:rotateX(-90deg);background:linear-gradient(180deg,var(--woodside),var(--wooddark))}
.bss{left:0;top:calc(-1*var(--h));width:100%;height:var(--h);transform-origin:bottom;transform:rotateX(90deg);background:linear-gradient(0deg,var(--woodside),var(--wooddark))}
.bse{left:calc(-1*var(--h));top:0;width:var(--h);height:100%;transform-origin:right;transform:rotateY(-90deg);background:var(--wooddark)}
.bsw{right:calc(-1*var(--h));top:0;width:var(--h);height:100%;transform-origin:left;transform:rotateY(90deg);background:var(--woodside)}
.box .btop{transform:translateZ(var(--h))}
.mon{position:absolute;left:12px;top:-40px;width:30px;height:24px;background:linear-gradient(#20313a,#101c22);border:2px solid #0b1418;border-radius:4px;box-shadow:0 0 10px rgba(141,233,216,.45);animation:mglow 2.6s ease-in-out infinite}
.mon::after{content:'';position:absolute;inset:3px;background:linear-gradient(135deg,#8de9d855,#5db6d955);border-radius:2px}
.mon::before{content:'';position:absolute;left:12px;top:24px;width:4px;height:10px;background:#0b1418}
@keyframes mglow{50%{box-shadow:0 0 16px rgba(141,233,216,.85)}}
