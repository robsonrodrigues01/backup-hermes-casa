<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório Virtual cuidar.vc</title>
<style>
:root{--floor:#eee0c4;--wall:#3f5148;--wallband:#556b5d;--desk:#cf9e6a;--accent:#0d9488;--ink:#26221c;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#171512;color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,#20302a,#1a231f);color:#f5f1e8;border-bottom:3px solid var(--accent)}
header h1{font-size:17px;letter-spacing:.2px}
.hinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.badge{background:linear-gradient(180deg,#0f3a33,#123f38);border:1px solid var(--accent);color:#7de3d3;border-radius:20px;padding:5px 13px;font-weight:600}
.badge.warn{background:#4a1512;border-color:#e05d4b;color:#ffb3a6}
#clock{font-variant-numeric:tabular-nums;background:#2a2620;border-radius:8px;padding:5px 11px;color:#ffe9a8}
.wrap{max-width:1140px;margin:0 auto;padding:18px 14px 44px}
.board{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:#d8d2c2}
.board span{background:#232019;border:1px solid #3c372c;border-radius:14px;padding:5px 11px}
.office{position:relative;height:660px;background:var(--floor);border:12px solid var(--wall);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);background-image:repeating-linear-gradient(90deg,rgba(148,116,70,.14) 0 2px,transparent 2px 88px),linear-gradient(180deg,rgba(120,90,50,.07),transparent 30%)}
.office::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 42% 16%,rgba(255,248,225,.5),transparent 46%),radial-gradient(ellipse at 50% 110%,rgba(52,38,16,.22),transparent 55%);pointer-events:none;z-index:58}
.wallband{position:absolute;left:0;right:0;top:0;height:62px;background:linear-gradient(180deg,var(--wallband),#4b5f52);border-bottom:4px solid #38493f;z-index:1}
.windows{position:absolute;left:64px;top:11px;width:330px;height:40px;border-radius:7px;background:linear-gradient(#a9dcf0,#e6f6fb 65%,#d5edf7);border:4px solid #37493f;box-shadow:inset 0 3px 8px rgba(255,255,255,.65);overflow:hidden;z-index:2}
.windows::before{content:'';position:absolute;left:-90px;top:7px;width:64px;height:13px;background:#ffffffd9;border-radius:10px;box-shadow:38px 7px 0 -2px #ffffffb3,96px 2px 0 -4px #ffffff96;animation:clouds 36s linear infinite}
.windows::after{content:'';position:absolute;right:26px;top:7px;width:16px;height:16px;border-radius:50%;background:radial-gradient(#ffe9a0,#f7c948);box-shadow:0 0 12px #ffd76e99;animation:sun 5s ease-in-out infinite}
@keyframes clouds{to{transform:translateX(520px)}}
@keyframes sun{50%{transform:scale(1.15)}}
.rug{position:absolute;left:330px;top:300px;width:220px;height:140px;background:radial-gradient(#cdbfa8,#b3a48c);border-radius:50%;box-shadow:0 8px 14px rgba(0,0,0,.18);z-index:2}
.zlab{position:absolute;font-size:10px;font-weight:700;letter-spacing:2px;color:#9b8a6d;text-transform:uppercase;z-index:3;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.poi{position:absolute;font-size:32px;opacity:.95;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));z-index:5;user-select:none}
.poi small{display:block;font-size:10px;text-align:center;background:#fff9;border-radius:6px;padding:1px 5px;font-family:inherit}
.poi#plant{animation:plsway 4.2s ease-in-out infinite;transform-origin:50% 95%}
@keyframes plsway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.steam{position:absolute;left:9px;top:-16px;width:18px;height:34px;pointer-events:none}
.steam i{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(2px);animation:rise 2.3s ease-out infinite}
.steam i:nth-child(2){left:8px;animation-delay:.75s}
.steam i:nth-child(3){left:-2px;animation-delay:1.4s}
@keyframes rise{0%{transform:translateY(6px) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translateY(-24px) scale(1.5);opacity:0}}
.desk{position:absolute;width:150px;height:78px;background:linear-gradient(#e0b988,var(--desk) 55%,#b98d5c);border-radius:12px;box-shadow:0 9px 16px rgba(0,0,0,.25),inset 0 2px 0 #f1d3a9;z-index:6;border:2px solid #a87f52}
.desk::after{content:'';position:absolute;left:9px;right:9px;top:7px;bottom:7px;border:1.5px dashed rgba(0,0,0,.16);border-radius:7px}
.desk.big{width:200px;height:86px}
.desk.long{width:520px;height:80px}
.plate{position:absolute;top:-66px;left:50%;transform:translate(-50%,8px);background:rgba(22,28,26,.9);color:#f5f1e8;border-radius:10px;padding:5px 10px;font-size:11px;line-height:1.35;text-align:center;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);border:1px solid rgba(141,227,216,.35);opacity:0;transition:opacity .6s var(--ease),transform .6s var(--ease);backdrop-filter:blur(3px)}
body.live .plate{opacity:1;transform:translate(-50%,0)}
.plate b{color:#8de9d8;display:block;font-size:12px}
.plate .st{color:#ffe9a8;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.desk.big .plate .st{max-width:190px}
.lp{position:absolute;top:calc(100% + 6px);width:74px;transform:translateY(-6px);padding:4px 4px;font-size:10px;background:rgba(22,28,26,.9);color:#f5f1e8;border-radius:9px;text-align:center;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);border:1px solid rgba(141,227,216,.35);opacity:0;transition:opacity .6s var(--ease),transform .6s var(--ease)}
body.live .lp{opacity:1;transform:translateY(0)}
.lp b{color:#8de9d8;display:block;font-size:10.5px}
.lp .st{color:#ffe9a8;display:block;max-width:70px;overflow:hidden;text-overflow:ellipsis;font-size:9px}
.mon{position:absolute;top:-15px;left:12px;font-size:24px;z-index:7;animation:mglow 2.6s ease-in-out infinite}
@keyframes mglow{50%{filter:drop-shadow(0 0 7px rgba(141,227,216,.9))}}
.chair{position:absolute;width:24px;height:24px;background:#4a4034;border:2px solid #6b5c49;border-radius:8px 8px 10px 10px;z-index:5;box-shadow:0 3px 5px rgba(0,0,0,.25)}
.roboffice{position:absolute;top:0;right:0;width:292px;height:252px;background:repeating-linear-gradient(45deg,#e6ddc6,#e6ddc6 12px,#ded4bc 12px,#ded4bc 24px);border-left:5px solid var(--wall);border-bottom:5px solid var(--wall);z-index:4}
.glass{position:absolute;inset:0;background:linear-gradient(120deg,rgba(180,220,230,.28),rgba(255,255,255,.1));pointer-events:none}
</style>
</head>
